# ============================================================================
# tests —— Woloong-kiauh 仓库门禁（**不需要镜像、不需要真机** ✓）
#
# 整合决议 v1.0（2026-10-22）后的门禁集：
#   ① 语法：全量 compileall
#   ② 单元：菜单/CLI（入口一致性、无上游入口、状态语义）
#   ③ 目录完整性：I1–I6（生成物、kind、档位自洽、依赖级不可装卸、与真源比对）
#   ④ 目录闭环：装 → 校验 → 卸 → 完全复原
#   ⑤ git-history：fork 必须与上游有共同祖先（可合并 ✓）
#
# 说明：旧门禁（verify-assets / test-customization / test-capability / audit-upstream）
#   建立在 restack + 手写清单之上，已随 v1.0 退役（见 woloong-release/DEPRECATED.md）。
# ============================================================================
name: tests

on:
  push:
    branches: [main, integration/v1.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - name: 检出
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装测试依赖
        run: python -m pip install --quiet pytest

      - name: ① 语法（compileall）
        run: python -m compileall -q kiauh

      - name: ② 单元测试（菜单 + CLI）
        env:
          PYTHONPATH: kiauh
        run: python -m pytest kiauh/core/menus/tests kiauh/core/cli/tests -q

      - name: ③ 目录完整性（I1–I6；无真源时自动 SKIP I6）
        env:
          PYTHONPATH: kiauh
        run: python tests/test-catalog-integrity.py

      - name: ④ 目录闭环（装 → 卸 → 复原）
        env:
          PYTHONPATH: kiauh
        run: python tests/test-woloong-catalog.py

      - name: ⑤ git-history：与上游有共同祖先（可合并）
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/dw-0/kiauh.git || true
          git fetch --quiet upstream --tags
          base="$(git merge-base HEAD upstream/master || true)"
          if [ -z "$base" ]; then
            echo "::error::与上游没有共同祖先（fork 模型被破坏）"
            exit 1
          fi
          echo "merge-base = ${base:0:10}"
